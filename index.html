<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Price Sheet</title>
<!-- Standalone SHEIN price converter. On-device OCR (Tesseract.js). No external API. -->
<style>
  :root{
    --ink:#1c1b1a; --ink-soft:#6b6763; --line:#e7e3dc; --paper:#faf8f4;
    --card:#fff; --accent:#ff5a2d; --accent-ink:#c8401a; --shade:#f1ede6;
    --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-num:"DM Mono",ui-monospace,Menlo,monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:14px 13px 104px}
  .top{position:sticky;top:0;z-index:20;background:var(--paper);padding:6px 0 10px;border-bottom:2px solid var(--ink);margin-bottom:14px}
  .top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .top p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:13px}
  .card h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 11px;font-weight:600}
  .set{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .f{display:flex;flex-direction:column;gap:5px}
  .f label{font-size:12px;color:var(--ink-soft);font-weight:500}
  .f input,.f select{font:inherit;font-family:var(--font-num);height:46px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--accent);background:#fff}

  .drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:24px 14px;text-align:center;background:var(--paper);cursor:pointer;margin-top:12px}
  .dropzone{position:relative;margin-top:12px}
  .dropzone .drop{margin-top:0;pointer-events:none}
  .dropzone input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .drop strong{color:var(--accent-ink);font-size:16px}
  .drop small{display:block;color:var(--ink-soft);margin-top:5px;font-size:13px}
  .status{font-size:12.5px;color:var(--ink-soft);margin-top:10px;display:none;align-items:center;gap:8px}
  .status .spin{width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{background:#fff2ee;border:1px solid #ffd2c4;color:var(--accent-ink);padding:11px 12px;border-radius:10px;font-size:13.5px;margin-top:11px;display:none}

  .page{margin-bottom:12px}
  .pagehead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);margin:0 2px 6px}
  .pagehead .rm{border:none;background:transparent;color:var(--ink-soft);font-size:13px;cursor:pointer;text-decoration:underline}
  .shotbox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .imgWrap{position:relative;line-height:0;touch-action:none}
  .imgWrap img{width:100%;display:block}
  .busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.62);font-size:13px;color:var(--ink-soft);gap:8px}
  .busy .spin{width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
  .plabel{position:absolute;transform:translateY(-50%);font-family:var(--font-num);font-weight:500;color:#111;background:rgba(255,255,255,.82);padding:1px 7px;border-radius:7px;white-space:nowrap;line-height:1.15;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:grab;touch-action:none}
  .plabel.drag{box-shadow:0 5px 18px rgba(0,0,0,.22)}
  .addp{display:inline-block;margin:6px 2px 0;font-size:12.5px;color:var(--accent-ink);background:none;border:none;cursor:pointer;text-decoration:underline}

  .totalcard{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
  .totalcard .lbl{font-weight:600;font-size:16px}
  .totalcard .amt{font-family:var(--font-num);font-weight:500;font-size:30px}
  .tiny{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:9px}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,248,244,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 13px calc(10px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:560px;margin:0 auto;display:flex;gap:9px}
  .act{font:inherit;font-weight:600;border:none;border-radius:12px;min-height:52px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1}
  .act.dark{background:var(--ink);color:#fff}
  .act.ghost{background:var(--shade);color:var(--ink)}
  .act:disabled{opacity:.5}
  .wspin{width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
</style>

<div class="wrap">
  <div class="top">
    <h1>Cart &rarr; Price sheet</h1>
    <p>Add screenshots &middot; prices read on your phone &middot; one total</p>
  </div>

  <div class="card">
    <h2>Your pricing</h2>
    <div class="set">
      <div class="f"><label>Rate (x)</label><input id="rate" type="number" inputmode="decimal" step="0.1" value="16"></div>
      <div class="f"><label>Round to</label>
        <select id="step"><option value="1">1</option><option value="5" selected>5</option><option value="10">10</option><option value="0.5">0.5</option></select>
      </div>
      <div class="f"><label>Mode</label>
        <select id="mode"><option value="nearest" selected>Nearest</option><option value="up">Up</option></select>
      </div>
    </div>
    <div class="dropzone">
      <div class="drop">
        <strong>Add cart screenshot(s)</strong>
        <small>pick one or several pages from your gallery</small>
      </div>
      <input id="file" type="file" accept="image/*" multiple>
    </div>
    <div id="status" class="status"></div>
    <div id="err" class="err"></div>
  </div>

  <div id="pages"></div>

  <div id="totalcard" class="totalcard" style="display:none">
    <span class="lbl" id="totLbl">Total</span><span class="amt" id="totAmt">0</span>
  </div>
  <div id="tiny" class="tiny" style="display:none">Tap a price to fix it &middot; drag to move it</div>
</div>

<div class="dock"><div class="inner">
  <label class="act ghost" for="file2">+ Add page</label>
  <input id="file2" type="file" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
  <button id="dlBtn" class="act dark" disabled>Download to send</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";
  var pages=[], seq=0, workerP=null;
  var $=function(i){return document.getElementById(i);};
  var rate=$("rate"),step=$("step"),mode=$("mode");
  var file=$("file"),file2=$("file2"),errEl=$("err"),statusEl=$("status");
  var pagesEl=$("pages"),totalcard=$("totalcard"),totAmt=$("totAmt"),tiny=$("tiny"),dlBtn=$("dlBtn");

  function showErr(h){errEl.innerHTML=h;errEl.style.display=h?"block":"none";}
  function setStatus(t){ if(!t){statusEl.style.display="none";return;} statusEl.style.display="flex"; statusEl.innerHTML='<span class="spin"></span>'+t; }

  function convert(o){var r=parseFloat(rate.value)||0,st=parseFloat(step.value)||1,raw=o*r;var v=mode.value==="up"?Math.ceil(raw/st)*st:Math.round(raw/st)*st;return Math.round(v*100)/100;}
  function np(it){return it.override!=null?it.override:convert(it.orig||0);}
  function fmt(n){return (Math.round(n*100)/100).toString().replace(/\.0+$/,"");}

  [rate,step,mode].forEach(function(el){el.addEventListener("input",function(){pages.forEach(function(p){p.items.forEach(function(it){if(it.el)it.el.textContent=fmt(np(it));});});updateTotal();});});

  file.addEventListener("change",function(){handleFiles(file.files);file.value="";});
  file2.addEventListener("change",function(){handleFiles(file2.files);file2.value="";});
  function handleFiles(list){
    showErr("");
    var arr=Array.prototype.slice.call(list).filter(function(f){
      return /^image\//.test(f.type) || f.type==="" || /\.(png|jpe?g|jpeg|webp|heic|heif|gif|bmp)$/i.test(f.name||"");
    });
    if(!arr.length){ showErr("That didn't come through as an image. Pick a screenshot (PNG or JPG) from your gallery."); return; }
    arr.forEach(addPage);
  }

  function addPage(f){
    var id=++seq, r=new FileReader();
    r.onload=function(){var p={id:id,imgData:r.result,mime:f.type||"image/jpeg",items:[],wrapW:0,wrapH:0,font:26};pages.push(p);buildPageEl(p);ocrPage(p);};
    r.readAsDataURL(f);
  }

  function buildPageEl(p){
    var wrap=document.createElement("div");wrap.className="page";
    var head=document.createElement("div");head.className="pagehead";head.innerHTML='<span>Page '+pages.length+'</span>';
    var rm=document.createElement("button");rm.className="rm";rm.textContent="remove";rm.onclick=function(){removePage(p);};head.appendChild(rm);
    var box=document.createElement("div");box.className="shotbox";
    var iw=document.createElement("div");iw.className="imgWrap";
    var img=document.createElement("img");
    var busy=document.createElement("div");busy.className="busy";busy.innerHTML='<span class="spin"></span> reading prices...';
    iw.appendChild(img);iw.appendChild(busy);box.appendChild(iw);
    var add=document.createElement("button");add.className="addp";add.textContent="+ add a missed price";add.onclick=function(){addLabel(p);};
    wrap.appendChild(head);wrap.appendChild(box);wrap.appendChild(add);pagesEl.appendChild(wrap);
    p.el=wrap;p.imgWrap=iw;p.img=img;p.busy=busy;
    img.onload=function(){measure(p);drawLabels(p);};img.src=p.imgData;
    dlBtn.disabled=false;totalcard.style.display="flex";tiny.style.display="block";
  }
  function removePage(p){
    var i=pages.indexOf(p);if(i<0)return;pages.splice(i,1);if(p.el&&p.el.parentNode)p.el.parentNode.removeChild(p.el);
    pagesEl.querySelectorAll(".pagehead span").forEach(function(s,idx){s.textContent="Page "+(idx+1);});
    if(!pages.length){totalcard.style.display="none";tiny.style.display="none";dlBtn.disabled=true;}
    updateTotal();
  }
  function measure(p){p.wrapW=p.imgWrap.clientWidth;p.wrapH=p.imgWrap.clientHeight;p.font=Math.max(17,Math.round(p.wrapW*0.072));}
  window.addEventListener("resize",function(){pages.forEach(function(p){if(p.img&&p.img.complete){measure(p);drawLabels(p);}});});

  // ---- on-device OCR ----
  function getWorker(){
    if(workerP) return workerP;
    if(typeof Tesseract==="undefined"){return Promise.reject(new Error("engine_unloaded"));}
    setStatus("Loading the price reader (first time only)...");
    workerP=Tesseract.createWorker("eng",1,{logger:function(m){
      if(m.status){ var pct=m.progress?(" "+Math.round(m.progress*100)+"%"):""; setStatus(m.status.charAt(0).toUpperCase()+m.status.slice(1)+pct); }
    }}).then(function(w){ setStatus(""); return w; });
    return workerP;
  }
  function findWords(node,out){
    if(!node||typeof node!=="object")return;
    if(Array.isArray(node.words)) node.words.forEach(function(w){ if(w&&w.bbox&&typeof w.text==="string") out.push(w); });
    for(var k in node){ var v=node[k]; if(Array.isArray(v)) v.forEach(function(c){findWords(c,out);}); else if(v&&typeof v==="object") findWords(v,out); }
  }
  function parsePrice(t){
    if(!t) return null;
    if(/[%+]/.test(t)) return null;          // percentages, "1000+", "200+"
    if(/k/i.test(t)) return null;            // "1.1k"
    var m=t.match(/(\d{1,4})[.,](\d{2})(?!\d)/);
    if(!m) return null;
    var v=parseFloat(m[1]+"."+m[2]);
    if(!(v>0)||v>100000) return null;
    return v;
  }
  function ocrPage(p){
    getWorker().then(function(worker){
      return worker.recognize(p.imgData,{},{blocks:true});
    }).then(function(res){
      var words=[]; findWords(res.data,words);
      var H=p.img.naturalHeight||1;
      var prices=[];
      words.forEach(function(w){
        var v=parsePrice(w.text); if(v==null)return;
        var yc=(w.bbox.y0+w.bbox.y1)/2; prices.push({v:v,yc:yc});
      });
      prices.sort(function(a,b){return a.yc-b.yc;});
      // cluster prices on the same row, keep the lowest (the price actually paid)
      var groups=[], thr=0.035*H;
      prices.forEach(function(pr){
        var g=groups[groups.length-1];
        if(g && Math.abs(pr.yc-g.yc)<thr){ g.vals.push(pr.v); g.yc=(g.yc+pr.yc)/2; }
        else groups.push({yc:pr.yc, vals:[pr.v]});
      });
      p.items=groups.map(function(g){ return {orig:Math.min.apply(null,g.vals), override:null, y:g.yc/H, left:null, top:null, el:null}; });
      if(p.busy)p.busy.style.display="none";
      if(!p.items.length){ showErr('Couldn\'t read prices on a page. Tap "+ add a missed price" to place them, or re-add a clearer screenshot.'); }
      drawLabels(p); updateTotal();
    }).catch(function(e){
      if(p.busy)p.busy.style.display="none";
      if((e.message||"")==="engine_unloaded"){ showErr("<b>The price reader didn't load.</b>Check your internet connection and re-add the screenshot (the reader downloads once, then works)."); }
      else { showErr("Reading failed on a page: "+(e.message||e)+'. Tap "+ add a missed price" to place prices yourself.'); }
      setStatus("");
    });
  }

  // ---- labels ----
  function drawLabels(p){
    p.imgWrap.querySelectorAll(".plabel").forEach(function(n){n.remove();});
    measure(p);
    var n=p.items.length;
    p.items.forEach(function(it,i){
      var lab=document.createElement("div");lab.className="plabel";lab.textContent=fmt(np(it));lab.style.fontSize=p.font+"px";
      var yf=(it.y!=null)?it.y:(n>1?0.10+0.48*(i/(n-1||1)):0.2);
      if(it.left==null)it.left=p.wrapW*0.70;
      if(it.top==null)it.top=yf*p.wrapH;
      it.el=lab;place(it);makeDrag(p,it,lab);p.imgWrap.appendChild(lab);
    });
    updateTotal();
  }
  function addLabel(p){var it={orig:0,override:0,y:0.3,left:p.wrapW*0.6,top:p.wrapH*0.3,el:null};p.items.push(it);drawLabels(p);setTimeout(function(){editItem(p,it);},50);}
  function place(it){it.el.style.left=it.left+"px";it.el.style.top=it.top+"px";}
  function editItem(p,it){
    var v=prompt("Price for this item (leave empty to remove):",fmt(np(it)));
    if(v==null)return;
    if(v.trim()===""||parseFloat(v)===0){var i=p.items.indexOf(it);if(i>-1)p.items.splice(i,1);drawLabels(p);updateTotal();return;}
    it.override=parseFloat(v);it.el.textContent=fmt(np(it));updateTotal();
  }
  function makeDrag(p,it,lab){
    var sx,sy,sl,st0,moved;
    function down(e){if(e.cancelable)e.preventDefault();var q=pt(e);sx=q.x;sy=q.y;sl=it.left;st0=it.top;moved=false;lab.classList.add("drag");
      window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("touchend",up);}
    function mv(e){if(e.cancelable)e.preventDefault();var q=pt(e);var dx=q.x-sx,dy=q.y-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;it.left=clamp(sl+dx,0,p.wrapW-16);it.top=clamp(st0+dy,8,p.wrapH-8);place(it);}
    function up(){lab.classList.remove("drag");window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);window.removeEventListener("touchmove",mv);window.removeEventListener("touchend",up);if(!moved)editItem(p,it);}
    lab.addEventListener("mousedown",down);lab.addEventListener("touchstart",down,{passive:false});
  }
  function pt(e){var t=e.touches&&e.touches[0];return {x:t?t.clientX:e.clientX,y:t?t.clientY:e.clientY};}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function updateTotal(){var t=0;pages.forEach(function(p){p.items.forEach(function(it){t+=np(it);});});totAmt.textContent=fmt(t);}

  // ---- combined download ----
  dlBtn.onclick=function(){
    if(!pages.length)return;
    dlBtn.disabled=true;var old=dlBtn.innerHTML;dlBtn.innerHTML='<span class="wspin"></span> Rendering...';
    var stage=document.createElement("div");
    stage.style.cssText="position:fixed;left:-99999px;top:0;width:"+(pages[0].wrapW||520)+"px;background:#fff";
    pages.forEach(function(p){var c=p.imgWrap.cloneNode(true);c.querySelectorAll(".busy").forEach(function(b){b.remove();});c.style.width="100%";stage.appendChild(c);});
    var bar=document.createElement("div");
    bar.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#1c1b1a;color:#fff;font-family:'Inter',sans-serif";
    bar.innerHTML='<span style="font-weight:600;font-size:17px">'+($("totLbl").textContent||"Total")+'</span><span style="font-family:'+"'DM Mono',monospace"+';font-size:28px">'+totAmt.textContent+'</span>';
    stage.appendChild(bar);document.body.appendChild(stage);
    html2canvas(stage,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false}).then(function(canvas){
      var a=document.createElement("a");a.download="price-sheet.png";a.href=canvas.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
    }).catch(function(e){showErr("Render failed: "+(e.message||e));}).then(function(){document.body.removeChild(stage);dlBtn.disabled=false;dlBtn.innerHTML=old;});
  };
})();
