<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Price Sheet</title>
<!-- v6 : zero external dependencies. Manual price entry + native canvas export. -->
<style>
  :root{--ink:#1c1b1a;--soft:#6b6763;--line:#e7e3dc;--paper:#faf8f4;--card:#fff;--accent:#ff5a2d;--accentink:#c8401a;--shade:#f1ede6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:12px 13px 104px}
  #alive{border-radius:10px;padding:10px 12px;font-weight:700;text-align:center;font-size:14px;margin-bottom:12px;background:#ffe2d7;color:#c8401a}
  #alive.ok{background:#dff5e6;color:#137a4b}
  .top h1{margin:0 0 2px;font-size:20px;font-weight:700}
  .top p{margin:0 0 12px;font-size:13px;color:var(--soft)}
  .top .v{font-family:monospace;background:var(--accent);color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;margin-left:6px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:13px}
  .card h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:0 0 11px;font-weight:700}
  .set{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .f{display:flex;flex-direction:column;gap:5px}
  .f label{font-size:12px;color:var(--soft)}
  .f input,.f select{font:inherit;font-family:monospace;height:46px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}

  .upbtn{position:relative;display:block;margin-top:12px;border:1.5px dashed var(--accent);border-radius:12px;padding:22px 14px;text-align:center;background:#fff6f2;color:var(--accentink);font-weight:700;font-size:16px;cursor:pointer}
  .upbtn small{display:block;color:var(--soft);font-weight:400;font-size:13px;margin-top:5px}
  .upbtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .err{background:#fff2ee;border:1px solid #ffd2c4;color:var(--accentink);padding:11px;border-radius:10px;font-size:13.5px;margin-top:11px;display:none}

  .page{margin-bottom:12px}
  .pagehead{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin:0 2px 6px}
  .pagehead .rm{border:none;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:13px}
  .shotbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .imgWrap{position:relative;line-height:0}
  .imgWrap img{width:100%;display:block}
  .hint{position:absolute;left:8px;top:8px;background:rgba(28,27,26,.78);color:#fff;font-size:12px;padding:4px 9px;border-radius:7px;line-height:1.2}
  .plabel{position:absolute;transform:translate(-50%,-50%);font-family:monospace;font-weight:700;color:#111;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:grab;touch-action:none}

  .totalcard{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
  .totalcard .amt{font-family:monospace;font-size:30px}
  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.95);border-top:1px solid var(--line);padding:10px 13px calc(10px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:560px;margin:0 auto;display:flex;gap:9px}
  .act{font:inherit;font-weight:700;border:none;border-radius:12px;min-height:52px;padding:0 16px;cursor:pointer;flex:1;position:relative;overflow:hidden}
  .act.dark{background:var(--ink);color:#fff}.act.ghost{background:var(--shade);color:var(--ink)}
  .act.ghost input[type=file]{position:absolute;inset:0;opacity:0}
  .act:disabled{opacity:.5}
</style>

<div class="wrap">
  <div id="alive">starting...</div>
  <div class="top">
    <h1>Cart &rarr; Price sheet <span class="v">v6</span></h1>
    <p>Add screenshots &middot; tap each item to set its price &middot; one total</p>
  </div>

  <div class="card">
    <h2>Your pricing</h2>
    <div class="set">
      <div class="f"><label>Rate (x)</label><input id="rate" type="number" inputmode="decimal" step="0.1" value="16"></div>
      <div class="f"><label>Round to</label><select id="step"><option>1</option><option selected>5</option><option>10</option><option value="0.5">0.5</option></select></div>
      <div class="f"><label>Mode</label><select id="mode"><option value="nearest" selected>Nearest</option><option value="up">Up</option></select></div>
    </div>
    <label class="upbtn">Add cart screenshot(s)<small>tap to pick one or more pages</small><input id="file" type="file" accept="image/*" multiple></label>
    <div id="err" class="err"></div>
  </div>

  <div id="pages"></div>

  <div id="totalcard" class="totalcard" style="display:none"><span id="totLbl">Total</span><span class="amt" id="totAmt">0</span></div>
</div>

<div class="dock"><div class="inner">
  <label class="act ghost">+ Add page<input id="file2" type="file" accept="image/*" multiple></label>
  <button id="dlBtn" class="act dark" disabled>Download to send</button>
</div></div>

<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i);};
  var alive=$("alive");
  alive.textContent="App is RUNNING (v6) - ready to use";
  alive.className="ok";

  var pages=[], seq=0;
  var rate=$("rate"),step=$("step"),mode=$("mode"),errEl=$("err");
  var pagesEl=$("pages"),totalcard=$("totalcard"),totAmt=$("totAmt"),dlBtn=$("dlBtn");

  function showErr(t){errEl.textContent=t;errEl.style.display=t?"block":"none";}
  function convert(o){var r=parseFloat(rate.value)||0,st=parseFloat(step.value)||1,raw=o*r;var v=mode.value==="up"?Math.ceil(raw/st)*st:Math.round(raw/st)*st;return Math.round(v*100)/100;}
  function np(it){return it.override!=null?it.override:convert(it.orig||0);}
  function fmt(n){return (Math.round(n*100)/100).toString().replace(/\.0+$/,"");}

  [rate,step,mode].forEach(function(el){el.addEventListener("input",function(){pages.forEach(function(p){p.items.forEach(function(it){if(it.el)it.el.textContent=fmt(np(it));});});total();});});

  function pick(inp){ var fs=inp.files; if(fs&&fs.length){ showErr(""); Array.prototype.slice.call(fs).forEach(addPage); } inp.value=""; }
  $("file").addEventListener("change",function(){pick(this);});
  $("file2").addEventListener("change",function(){pick(this);});

  function addPage(f){
    var id=++seq, r=new FileReader();
    r.onerror=function(){showErr("Couldn't read that file. Try another screenshot.");};
    r.onload=function(){ var p={id:id,data:r.result,items:[],wrapW:0,wrapH:0,font:26}; pages.push(p); build(p); };
    r.readAsDataURL(f);
  }

  function build(p){
    var wrap=document.createElement("div");wrap.className="page";
    var head=document.createElement("div");head.className="pagehead";
    head.innerHTML='<span>Page '+pages.length+'</span>';
    var rm=document.createElement("button");rm.className="rm";rm.textContent="remove";rm.onclick=function(){var i=pages.indexOf(p);if(i>-1)pages.splice(i,1);wrap.remove();renumber();if(!pages.length){totalcard.style.display="none";dlBtn.disabled=true;}total();};
    head.appendChild(rm);
    var box=document.createElement("div");box.className="shotbox";
    var iw=document.createElement("div");iw.className="imgWrap";
    var img=document.createElement("img");
    var hint=document.createElement("div");hint.className="hint";hint.textContent="Tap each item to add its price";
    iw.appendChild(img);iw.appendChild(hint);box.appendChild(iw);
    wrap.appendChild(head);wrap.appendChild(box);pagesEl.appendChild(wrap);
    p.el=wrap;p.iw=iw;p.img=img;p.hint=hint;
    img.onerror=function(){showErr("That image couldn't be shown - use a normal screenshot (PNG/JPG), not a HEIC photo.");};
    img.onload=function(){ measure(p); dlBtn.disabled=false; totalcard.style.display="flex"; wrap.scrollIntoView({behavior:"smooth",block:"center"}); };
    img.src=p.data;
    iw.addEventListener("click",function(e){ if(e.target.classList.contains("plabel"))return; var rc=iw.getBoundingClientRect(); addLabel(p,e.clientX-rc.left,e.clientY-rc.top); });
  }
  function renumber(){var s=pagesEl.querySelectorAll(".pagehead span");for(var i=0;i<s.length;i++)s[i].textContent="Page "+(i+1);}
  function measure(p){p.wrapW=p.iw.clientWidth;p.wrapH=p.iw.clientHeight;p.font=Math.max(18,Math.round(p.wrapW*0.075));}

  function addLabel(p,x,y){
    var v=prompt("SHEIN price for this item (the number on the screenshot):","");
    if(v==null||v.trim()==="")return;
    var orig=parseFloat(v); if(isNaN(orig))return;
    if(p.hint){p.hint.remove();p.hint=null;}
    var it={orig:orig,override:null,x:x,y:y,el:null};
    p.items.push(it); draw(p,it); total();
  }
  function draw(p,it){
    var lab=document.createElement("div");lab.className="plabel";lab.style.fontSize=p.font+"px";lab.textContent=fmt(np(it));
    lab.style.left=it.x+"px";lab.style.top=it.y+"px";it.el=lab;
    var sx,sy,ox,oy,moved;
    function dn(e){if(e.cancelable)e.preventDefault();var q=pt(e);sx=q.x;sy=q.y;ox=it.x;oy=it.y;moved=false;
      window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("touchend",up);}
    function mv(e){if(e.cancelable)e.preventDefault();var q=pt(e);var dx=q.x-sx,dy=q.y-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;it.x=Math.max(8,Math.min(p.wrapW-8,ox+dx));it.y=Math.max(8,Math.min(p.wrapH-8,oy+dy));lab.style.left=it.x+"px";lab.style.top=it.y+"px";}
    function up(){window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);window.removeEventListener("touchmove",mv);window.removeEventListener("touchend",up);if(!moved)edit(p,it);}
    lab.addEventListener("mousedown",dn);lab.addEventListener("touchstart",dn,{passive:false});
    p.iw.appendChild(lab);
  }
  function edit(p,it){
    var v=prompt("SHEIN price (leave empty to remove this one):",it.orig);
    if(v==null)return;
    if(v.trim()===""){var i=p.items.indexOf(it);if(i>-1)p.items.splice(i,1);if(it.el)it.el.remove();total();return;}
    var o=parseFloat(v);if(!isNaN(o)){it.orig=o;it.override=null;it.el.textContent=fmt(np(it));total();}
  }
  function pt(e){var t=e.touches&&e.touches[0];return {x:t?t.clientX:e.clientX,y:t?t.clientY:e.clientY};}
  function total(){var t=0;pages.forEach(function(p){p.items.forEach(function(it){t+=np(it);});});totAmt.textContent=fmt(t);}
  window.addEventListener("resize",function(){pages.forEach(function(p){if(p.img&&p.img.complete)measure(p);});});

  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
  dlBtn.onclick=function(){
    if(!pages.length)return;
    var W=0;pages.forEach(function(p){W=Math.max(W,p.img.naturalWidth||p.wrapW||520);});if(!W)W=520;
    var barH=Math.round(W*0.11), totalH=0, lay=[];
    pages.forEach(function(p){var iw=p.img.naturalWidth||p.wrapW,ih=p.img.naturalHeight||p.wrapH;var s=W/iw;var h=Math.round(ih*s);lay.push({p:p,y:totalH,h:h});totalH+=h;});
    totalH+=barH;
    var cv=document.createElement("canvas");cv.width=W;cv.height=totalH;var c=cv.getContext("2d");
    c.fillStyle="#fff";c.fillRect(0,0,W,totalH);
    lay.forEach(function(L){var p=L.p;c.drawImage(p.img,0,L.y,W,L.h);var ds=W/(p.wrapW||W);
      p.items.forEach(function(it){var x=it.x*ds,y=L.y+it.y*ds,txt=fmt(np(it)),fs=Math.round(p.font*ds);
        c.font="700 "+fs+"px monospace";var tw=c.measureText(txt).width,px=fs*0.35,py=fs*0.25;
        c.fillStyle="rgba(255,255,255,0.86)";rr(c,x-tw/2-px,y-fs/2-py,tw+px*2,fs+py*2,fs*0.28);c.fill();
        c.fillStyle="#111";c.textAlign="center";c.textBaseline="middle";c.fillText(txt,x,y);});});
    c.fillStyle="#1c1b1a";c.fillRect(0,totalH-barH,W,barH);
    var bf=Math.round(barH*0.34);c.textBaseline="middle";
    c.fillStyle="#fff";c.textAlign="left";c.font="700 "+bf+"px sans-serif";c.fillText($("totLbl").textContent||"Total",Math.round(W*0.04),totalH-barH/2);
    c.textAlign="right";c.font=Math.round(bf*1.1)+"px monospace";c.fillText(totAmt.textContent,W-Math.round(W*0.04),totalH-barH/2);
    var a=document.createElement("a");a.download="price-sheet.png";a.href=cv.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
  };
})();
</script>
